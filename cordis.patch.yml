# provider: GUI multi-account management dropdown.
#
# DSH v0.1.5-rc.1 scopes connection RPC registrations to the Context that
# reads `ctx.connection`. Registering a custom channel therefore mounts the
# route through that caller context's `webServer` service. The provider entry
# must explicitly inject `webServer` before calling `connection.rpc.handle()`.
# Keep the full runtime dependency set here so the loader waits for every
# service the host half consumes before applying the plugin.
- insert:
    - id: provider
      name: '@tsuuanmi/provider'
      inject: [connection, credentials, settings, webServer]
      config: {}
